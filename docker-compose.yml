services:
  # БД для уведомлений и настроек
  narochny-db:
    image: postgres:18.6
    container_name: narochny-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: narochny-db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s